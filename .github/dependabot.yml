# Dependabot version updates. Its PRs get no preview (ADR-0021 Notes 2026-10-14): CI's check +
# test is their gate. Few, grouped PRs keep the review load low. Pins that AGENTS.md "Toolchain"
# explains are kept by the ignore rules.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace; one root lockfile
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 2
    # ADR-0029: PR titles become release inputs. Production bumps are `fix(deps): …` (they cut a
    # release), development bumps `chore(deps-dev): …` (they don't).
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # better-auth and its exactly pinned CLI (`auth`) must stay on one version, majors
      # included. Listed first: a dependency goes to the first group it matches.
      better-auth:
        patterns: [better-auth, auth, '@better-auth/*']
      # ADR-0028: the docs site's Astro and Starlight (0.x, pinned exactly; minors can break) get
      # their own PR. Dev dependencies of apps/docs, so titled `chore(deps-dev)` (no app release).
      astro:
        patterns: [astro, '@astrojs/*']
      # Every other minor and patch update, one PR per dependency type so each title is either
      # `fix(deps)` or `chore(deps-dev)`; majors stay separate PRs.
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript # ~6.0: typescript-eslint doesn't support TS 7
        update-types: [version-update:semver-major]
      - dependency-name: vitest # ^4.1: @cloudflare/vitest-plugin doesn't support Vitest 5
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node' # the runtime is Node 24
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions # SHA-pinned in .github/workflows
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
