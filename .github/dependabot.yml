# Dependabot version updates. Its PRs get no preview (ADR-0021 Notes 2026-10-14): CI's Validate
# job is their gate. Few, grouped PRs keep the review load low. Pins that AGENTS.md "Toolchain"
# explains are kept by the ignore rules.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace; one root lockfile
    directory: /
    # Monthly (owner decision 2026-11-11): fewer PRs and CI runs; security updates ignore the
    # schedule. The limit lets one run open a PR per group (six) instead of queueing them a month.
    schedule:
      interval: monthly
    # Owner decision 2026-10-29: version updates wait 7 days after a release (time for a
    # compromised publish to be caught). Cooldown never applies to security updates, which stay
    # immediate.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    # ADR-0029: PR titles become release inputs. Production bumps are `fix(deps): …` (they cut a
    # release), development bumps `chore(deps-dev): …` (they don't).
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # better-auth and its exactly pinned CLI (`auth`) must stay on one version, majors
      # included. Listed first: a dependency goes to the first group it matches.
      better-auth:
        patterns: [better-auth, auth, '@better-auth/*']
      # ADR-0028, ADR-0033: the static sites' Astro, Starlight (0.x, pinned exactly; minors can
      # break) and Astro integrations get their own PR. Dev dependencies of apps/docs and apps/site,
      # so titled `chore(deps-dev)` (no app release).
      astro:
        patterns: [astro, '@astrojs/*']
      # ADR-0006: Oxfmt is 0.x and pinned exactly; a bump can change formatting, so it gets its own
      # PR (`chore(deps-dev)`) whose reformatting diff is reviewed.
      oxfmt:
        patterns: [oxfmt]
      # ADR-0045, ADR-0046: sonner is pinned exactly and its injected CSS is allowed by hash
      # (apps/app/src/server/csp-hashes.gen.ts). A bump arrives alone and fails `pnpm check` until
      # the hash is regenerated (`pnpm csp:hashes`) and the CSP change reviewed.
      sonner:
        patterns: [sonner]
      # Every other minor and patch update, one PR per dependency type so each title is either
      # `fix(deps)` or `chore(deps-dev)`; majors stay separate PRs.
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript # ~6.0: typescript-eslint doesn't support TS 7
        update-types: [version-update:semver-major]
      - dependency-name: vitest # ^4.1: @cloudflare/vitest-plugin doesn't support Vitest 5
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node' # the runtime is Node 24
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions # SHA-pinned in .github/workflows and .github/actions
    directories: [/, /.github/actions/*]
    # Monthly: version bumps of the pinned actions rarely matter within a month, and each update run
    # and its PR's CI cost Actions minutes. Security updates don't wait for this schedule.
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
