name: Static site rollback

# ADR-0029 decision 6 for a static site (ADR-0028, ADR-0033 decision 9): `wrangler rollback` to a
# given version, with a required reason. No build, seconds. A static site has no data or secrets,
# so none of rollback.yml's migration or secret guards apply. The callers (docs-rollback.yml,
# site-rollback.yml) own the dispatch inputs and share the site's deploy lock.
on:
  workflow_call:
    inputs:
      site:
        description: The site's app directory under apps/ (docs or site), also its environment's name
        type: string
        required: true
      reason:
        type: string
        required: true
      version_id:
        type: string
        required: true
    # The caller passes the environment secret by name; the called job's `environment` selects its
    # value (a secret not passed resolves to an empty string, so it's required).
    secrets:
      token:
        description: The site's per-Worker Cloudflare token (an environment secret)
        required: true

permissions: {}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.site }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Roll back
        env:
          SITE: ${{ inputs.site }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/rollback.sh
