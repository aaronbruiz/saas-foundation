name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database (mirrors docker/postgres-init)
        run: docker exec ${{ job.services.postgres.id }} psql -U app -d app -c "CREATE DATABASE app_test OWNER app"
      - run: pnpm check
      - run: pnpm test
      - name: Build and scan the client bundle for secrets
        run: pnpm build && scripts/scan-client-bundle.sh
      # ADR-0021: this job runs PR code and holds no secrets. For same-repo PRs it hands the build
      # to preview.yml (workflow_run, default-branch code), which treats it strictly as data.
      - name: Assemble the preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          out="$RUNNER_TEMP/preview-artifact"
          mkdir -p "$out/apps/web" "$out/packages/db"
          rsync -a --exclude '.dev.vars*' --exclude '.env*' apps/web/dist "$out/apps/web/"
          rsync -a packages/db/drizzle "$out/packages/db/"
      - name: Upload the preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-artifact
          path: ${{ runner.temp }}/preview-artifact
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
      # The PR's own Playwright suite, against a local dev server (no secrets here; preview.yml runs
      # the default branch's suite against the deployed preview). After the upload, so these local
      # dev vars can never reach the artifact.
      - name: E2E (local dev server)
        run: |
          { echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"; echo 'BETTER_AUTH_URL=http://localhost:3000'
            echo 'SIGNUP_MODE=open'; echo 'EMAIL_DELIVERY=console'; } >apps/web/.dev.vars
          pnpm db:migrate
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm test:e2e
