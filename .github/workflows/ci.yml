name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ADR-0021 Notes 2026-10-21: a PR confined to documentation and the static sites skips the app's
  # database, tests, build and E2E. `app` is true when any changed file is outside those paths; the
  # action splits a rename into its added and deleted paths, so both count. Pushes to main skip this
  # job and run everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # These rules are mirrored by preview.yml's `resolve` job (a shell grep on the files API):
      # preview runs on `workflow_run`, where this action would need the PR head fetched into the
      # job, so it can't share them. Change both together.
      # `pnpm-lock.yaml` and root files count as app changes, even for a docs- or site-only bump:
      # paths can't tell which importers a lockfile change reaches (shared transitive packages
      # such as typescript or wrangler), and a lockfile graph walk isn't worth it for the rare
      # `astro` group PR (2026-10-29).
      # The PR files API stops at 3,000 files and the action doesn't check it got them all. Outside
      # 1..3000 (or with no count) the step is skipped, `app` stays empty and everything runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files <= 3000
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!apps/docs/**'
              - '!apps/site/**'
              - '!*.md'

  # GitHub bills every job at least a whole minute on a private repo (e.g. a copy of this template),
  # so the seconds-long bindings check runs here as its first steps instead of in its own job.
  check:
    name: check + test
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Anything but an explicit 'false' (a push, a missing output) runs the app suite.
      APP: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app != 'false' }}
    services:
      postgres:
        # An empty image doesn't start the service.
        image: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.app != 'false') && 'postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24' || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # on a PR: the merge commit and its base parent, for check-bindings and migrations
          # Credentials stay: the migrations check may `git fetch` its base, which needs the read-only
          # token in a private repository (products made from this template).
      - uses: ./.github/actions/setup
        with:
          cache: pnpm
          install: false
      # AGENTS.md invariant 14: a new binding or product needs a new ADR; storage bindings need a
      # `previews` override. Before the install, so it fails fast.
      - name: Bindings need an ADR
        if: github.event_name == 'pull_request'
        run: node scripts/check-bindings.mjs HEAD^1
      - run: node scripts/check-secrets.mjs # ADR-0016: no EMAIL_VERIFICATION in the committed config
      - run: pnpm install --frozen-lockfile
      - name: Create test database (mirrors docker/postgres-init)
        if: env.APP == 'true'
        run: docker exec ${{ job.services.postgres.id }} psql -U app -d app -c "CREATE DATABASE app_test OWNER app"
      # Every PR: lint, formatting, typecheck (astro check for the static sites) and the plans/Worker
      # types drift checks need no database, and nothing else runs them on a static-site PR.
      - run: pnpm check
      # Invariant 10: applied migrations stay untouched, the history has no collision, no schema
      # change lacks its migration, schema/auth.ts is current, and the migrations' SQL builds the
      # schema. Base: the PR's merge parent, or the commit a push to main replaced (fetched if the
      # depth-2 checkout lacks it).
      - name: Migrations are immutable and match the schema
        if: env.APP == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if [[ ! "$BASE" =~ ^0+$ ]] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          node scripts/check-migrations.mjs "$BASE"
          SCHEMA_CHECK_PROBE= scripts/check-schema-sql.sh
          node --test scripts/check-schema-sql.test.mjs packages/db/scripts/migrate-lock-timeout.test.mjs
      - run: pnpm test
        if: env.APP == 'true'
      # dump.sh against a disposable Postgres and a local S3 stand-in, with the runner's AWS CLI
      # (runbook "Backups by hand"). Not in package.json: that path also triggers docs/site deploys.
      - run: node --test scripts/backup/dump.test.mjs
        if: env.APP == 'true'
      - name: Build and scan the client bundle for secrets
        if: env.APP == 'true'
        run: pnpm build && scripts/scan-client-bundle.sh
      # ADR-0021: this job runs PR code and holds no secrets. For same-repo PRs it hands the build
      # to preview.yml (workflow_run, default-branch code), which treats it strictly as data.
      - name: Assemble the preview artifact
        if: env.APP == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          out="$RUNNER_TEMP/preview-artifact"
          mkdir -p "$out/apps/app" "$out/packages/db"
          rsync -a --exclude '.dev.vars*' --exclude '.env*' apps/app/dist "$out/apps/app/"
          rsync -a packages/db/drizzle "$out/packages/db/"
      - name: Upload the preview artifact
        if: env.APP == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-artifact
          path: ${{ runner.temp }}/preview-artifact
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
      # The PR's own Playwright suite, against a local dev server (no secrets here; preview.yml runs
      # the default branch's suite against the deployed preview). After the upload, so these local
      # dev vars can never reach the artifact.
      - name: E2E (local dev server)
        if: env.APP == 'true'
        run: |
          { echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"; echo 'BETTER_AUTH_URL=http://localhost:3000'
            echo 'SIGNUP_MODE=open'; echo 'EMAIL_DELIVERY=console'
            # ADR-0025: Cloudflare's public always-pass Turnstile test keys.
            echo 'TURNSTILE_SITE_KEY=1x00000000000000000000AA'
            echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA'; } >apps/app/.dev.vars
          pnpm db:migrate
          pnpm --filter app exec playwright install --with-deps chromium
          pnpm test:e2e
