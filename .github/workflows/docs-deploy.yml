name: Docs deploy

# ADR-0028 decision 6, ADR-0029 decision 5: continuous production deploys of the docs site. Every
# push to `main` that can change its build deploys it at 100% (no release PR, tags or 0% stage);
# a dispatch redeploys a given commit of `main`'s history. The build job holds no secret; the
# deploy job (environment `docs`, main only) runs `main`'s scripts with the token that is Workers
# Editor on the docs Worker only, and takes the built site as data.
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .node-version
      - .github/workflows/docs*.yml
      - scripts/check-bindings.mjs
      - scripts/scan-client-bundle.sh
      - scripts/docs/**
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main's history to build and deploy (full 40-character SHA)
        type: string
        required: true

# One lock for every change to the docs Worker (deploys and docs-rollback.yml). Nothing is
# cancelled, so a queued rollback isn't dropped when a newer deploy queues (ADR-0029 decision 3).
concurrency:
  group: deploy-saas-foundation-docs
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0 # check the commit is on main's history
          persist-credentials: false
      - name: Check the commit
        id: commit
        env:
          SHA: ${{ inputs.commit || github.sha }}
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::run this from main"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA isn't on main's history"; exit 1; }
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
      # No dependency cache in a production build (ADR-0029 decision 3, step 1).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs build
      - name: Write version.json
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          jq -n --arg c "$SHA" --arg b "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{commit: $c, built: $b}' >apps/docs/dist/version.json
      - name: Scan the site for secrets
        run: scripts/scan-client-bundle.sh apps/docs/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: apps/docs/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site
      - name: Deploy
        env:
          SHA: ${{ needs.build.outputs.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/docs-site
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Workers Editor on the docs Worker only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_TOKEN }}
        run: scripts/docs/deploy.sh
