name: Static site preview

# ADR-0028 decision 5, ADR-0033 decision 9: a PR's static site as Worker Preview `pr-N` of the
# site's preview Worker, and its deletion when the PR closes. The callers (docs-preview.yml,
# site-preview.yml) are triggered by `workflow_run` of the site's build and `pull_request_target`,
# which run them from the default branch, and own the lock. The token lives in environment
# `<site>-preview` (main only) and is Workers Editor on the site's preview Worker only. No job runs
# PR code or restores a cache: the deploy job installs the default branch's lockfile and deploys
# the PR's built site (the build run's `<site>-site` artifact) as data.
#   resolve (no secrets) → deploy (<site>-preview) → comment (no secrets)
#   cleanup on close (<site>-preview; tidiness: the preview has no data to revoke)
on:
  workflow_call:
    inputs:
      site:
        description: The site's app directory under apps/ (docs or site); its environment is `<site>-preview`
        type: string
        required: true
      label:
        description: The site's name in the PR comment (Docs, Site)
        type: string
        required: true
    # The caller passes the environment secret by name; the called job's `environment` selects its
    # value (a secret not passed resolves to an empty string, so it's required).
    secrets:
      token:
        description: The site's per-Worker Cloudflare token (an environment secret)
        required: true

permissions: {}

jobs:
  resolve:
    # Same-repo PRs only, once the site's build passed; not the release PR (ADR-0029) nor Dependabot's
    # PRs (ADR-0021 Notes 2026-10-14).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'release-please--') &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the default branch's scripts
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOCK_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        # As preview.yml (scripts/preview/resolve-pr.sh): the PR number comes from GitHub, never from
        # the branch name or artifact.
        # An assignment, so a failing script fails the step (inside echo's argument it wouldn't).
        run: |
          pr="$(scripts/preview/resolve-pr.sh)"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.site }}-preview
    permissions:
      contents: read
      actions: read # download the artifact of the triggering build run
      pull-requests: read # PR state before deploying
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Default-branch lockfile, no cache: nothing the PR influenced is restored or saved here.
      - uses: ./.github/actions/setup
      - name: Download the PR's site (untrusted data)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site }}-site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy the preview
        id: deploy
        env:
          SITE: ${{ inputs.site }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/site
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          GH_TOKEN: ${{ github.token }}
          # Workers Editor on the site's preview Worker only (an environment secret).
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/preview.sh

  comment:
    needs: [resolve, deploy]
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the default branch's scripts
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Comment the preview URL on the PR
        env:
          SITE: ${{ inputs.site }}
          LABEL: ${{ inputs.label }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          URL: ${{ needs.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$URL" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev$ ]] || { echo "unexpected URL shape"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "unexpected PR number"; exit 1; }
          [[ "$SITE" =~ ^[a-z]+$ ]] || { echo "unexpected site"; exit 1; }
          export MARKER="<!-- saas-foundation-$SITE-preview -->"
          export BODY="$MARKER
          **$LABEL preview** for ${HEAD_SHA::7}: $URL
          Public draft on workers.dev (ADR-0028); no data, nothing to revoke."
          scripts/preview/comment.sh

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.site }}-preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # curl + jq + gh only: no package install.
      - name: Delete this PR's Preview
        env:
          SITE: ${{ inputs.site }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/preview-down.sh
