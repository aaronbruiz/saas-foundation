name: Static site preview

# ADR-0028 decision 5, ADR-0033 decision 9: a PR's static site as Worker Preview `pr-N` of the
# site's preview Worker, and its deletion when the PR closes. The caller (docs-preview.yml) is
# triggered by `workflow_run` of the site's build and `pull_request_target`, which run it from the
# default branch, and owns the lock. The token lives in environment `<site>-preview` (main only)
# and is Workers Editor on the site's preview Worker only. No job runs PR code or restores a cache:
# the deploy job installs the default branch's lockfile and deploys the PR's built site (the build
# run's `<site>-site` artifact) as data.
#   resolve (no secrets) → deploy (<site>-preview) → comment (no secrets)
#   cleanup on close (<site>-preview; tidiness: the preview has no data to revoke)
on:
  workflow_call:
    inputs:
      site:
        description: The site's app directory under apps/ (docs); its environment is `<site>-preview`
        type: string
        required: true
      label:
        description: The site's name in the PR comment (Docs)
        type: string
        required: true
    # The caller passes the environment secret by name; the called job's `environment` selects its
    # value (a secret not passed resolves to an empty string, so it's required).
    secrets:
      token:
        description: The site's per-Worker Cloudflare token (an environment secret)
        required: true

permissions: {}

jobs:
  resolve:
    # Same-repo PRs only, once the site's build passed; not the release PR (ADR-0029) nor Dependabot's
    # PRs (ADR-0021 Notes 2026-10-14).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'release-please--') &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LOCK_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        # As preview.yml: the PR number comes from GitHub, never from the branch name or artifact.
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected head sha"; exit 1; }
          prs="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" | jq -r '[.[] | select(.state == "open"
            and .head.sha == env.HEAD_SHA and .head.repo.full_name == env.REPO
            and .base.repo.full_name == env.REPO) | .number]')"
          count="$(jq length <<<"$prs")"
          if [ "$count" != 1 ]; then echo "no single open PR at $HEAD_SHA ($count); skipping"; exit 0; fi
          pr="$(jq -r '.[0]' <<<"$prs")"
          [[ "$pr" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "unexpected PR number"; exit 1; }
          if [ "$pr" != "$LOCK_PR" ]; then
            echo "::notice title=Preview skipped::this run isn't locked for PR #$pr (lock: '${LOCK_PR}')"
            exit 0
          fi
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.site }}-preview
    permissions:
      contents: read
      actions: read # download the artifact of the triggering build run
      pull-requests: read # PR state before deploying
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Default-branch lockfile, no cache: nothing the PR influenced is restored or saved here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download the PR's site (untrusted data)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site }}-site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy the preview
        id: deploy
        env:
          SITE: ${{ inputs.site }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/site
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          GH_TOKEN: ${{ github.token }}
          # Workers Editor on the site's preview Worker only (an environment secret).
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/preview.sh

  comment:
    needs: [resolve, deploy]
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment the preview URL on the PR
        env:
          SITE: ${{ inputs.site }}
          LABEL: ${{ inputs.label }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          URL: ${{ needs.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$URL" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev$ ]] || { echo "unexpected URL shape"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "unexpected PR number"; exit 1; }
          [[ "$SITE" =~ ^[a-z]+$ ]] || { echo "unexpected site"; exit 1; }
          marker="<!-- saas-foundation-$SITE-preview -->"
          body="$marker
          **$LABEL preview** for ${HEAD_SHA::7}: $URL
          Public draft on workers.dev (ADR-0028); no data, nothing to revoke."
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.site }}-preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # curl + jq + gh only: no package install.
      - name: Delete this PR's Preview
        env:
          SITE: ${{ inputs.site }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/preview-down.sh
