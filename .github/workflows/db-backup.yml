name: DB backups

# ADR-0003 backup option A (`snapshot`): a daily Neon branch snapshot of production `main` (no compute),
# keeping the newest BACKUP_KEEP (default 3). Covers mistakes older than Neon Free's 6 h restore window.
# ADR-0023 backup option B (`dump`): a daily pg_dump of `main` to Cloudflare R2, kept 30 days by the
# bucket's lifecycle rule. Covers a Neon outage or the loss of the Neon project. The jobs are independent:
# `dump` runs whatever `snapshot`'s outcome, only after it.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-backups
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # ADR-0019: the production-project key lives only in the `production` environment, which
    # GitHub restricts to `main`. An environment doesn't fence a repo-level secret of the same name,
    # so none may exist: the repository holds no secrets (runbook "CI credentials").
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Snapshot production main
        # Secrets only reach this step, not checkout/setup/install (dependency lifecycle scripts).
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP || '3' }}
        run: scripts/backup/snapshot.sh

  dump:
    # When both jobs started together, `dump` sometimes stayed at the `production` environment gate
    # ("waiting", no runner) for days, holding the `db-backups` concurrency group (3 of 8 runs,
    # 2026-09-30 to 2026-10-02). Cause unproven (other simultaneous starts ran fine); running it after
    # `snapshot` is a workaround for a suspected gate race.
    needs: snapshot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Same fence as `snapshot`: every credential below lives only in `production` (ADR-0019, ADR-0023).
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Dump production main to R2
        # Secrets only reach this step, not checkout/setup/install (dependency lifecycle scripts).
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: scripts/backup/dump.sh
