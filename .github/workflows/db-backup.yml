name: DB snapshots

# ADR-0003 backup option A: a daily Neon branch snapshot of production `main` (no compute),
# keeping the newest BACKUP_KEEP (default 3). Covers mistakes older than Neon Free's 6 h
# restore window; not a provider outage (option B, an off-provider dump, is registered for later).
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-snapshots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Snapshot production main
        # Secrets only reach this step, not checkout/setup/install (dependency lifecycle scripts).
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP || '3' }}
        run: scripts/backup/snapshot.sh
