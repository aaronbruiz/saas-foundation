name: Docs

# ADR-0028: builds the public docs site (apps/docs) for a PR that can change its build, with the
# shared static-site build (ADR-0033 decision 9). T0: no secrets, no environment. For a same-repo PR
# it uploads the site, which docs-preview.yml deploys as data. No push build: on `main`,
# docs-deploy.yml's build runs the same checks (ADR-0028 Notes 2026-10-15).
on:
  pull_request:
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .node-version
      - .github/workflows/docs*.yml
      - .github/workflows/static-*.yml
      - .github/actions/**
      - scripts/check-bindings.mjs
      - scripts/scan-client-bundle.sh
      - scripts/sites/**

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/static-build.yml
    permissions:
      contents: read
    with:
      site: docs
