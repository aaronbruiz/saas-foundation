name: Static site deploy

# ADR-0028 decision 6, ADR-0033 decision 9, ADR-0029 decision 5: continuous production deploy of a
# static site at 100% (no release PR, tags or 0% stage); the callers (docs-deploy.yml,
# site-deploy.yml) own the triggers and the lock. A dispatch redeploys a given commit of `main`'s
# history. The build job holds no secret; the deploy job (the site's environment, main only) runs
# `main`'s scripts with the token that is Workers Editor on the site's Worker only, and takes the
# built site as data.
on:
  workflow_call:
    inputs:
      site:
        description: The site's app directory under apps/ (docs or site), also its environment's name
        type: string
        required: true
      commit:
        description: Commit on main's history to deploy (default the pushed commit)
        type: string
        default: ''
    # The caller passes the environment secret by name; the called job's `environment` selects its
    # value (a secret not passed resolves to an empty string, so it's required).
    secrets:
      token:
        description: The site's per-Worker Cloudflare token (an environment secret)
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SITE: ${{ inputs.site }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0 # check the commit is on main's history
          persist-credentials: false
      - name: Check the commit
        id: commit
        env:
          SHA: ${{ inputs.commit || github.sha }}
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::run this from main"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full SHA"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not $SHA"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA isn't on main's history"; exit 1; }
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
      # No dependency cache in a production build (ADR-0029 decision 3, step 1).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$SITE" build
      - name: Write version.json
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          jq -n --arg c "$SHA" --arg b "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{commit: $c, built: $b}' >"apps/$SITE/dist/version.json"
      - name: Scan the site for secrets
        run: scripts/scan-client-bundle.sh "apps/$SITE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.site }}-site
          path: apps/${{ inputs.site }}/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.site }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site }}-site
          path: ${{ runner.temp }}/site
      - name: Deploy
        env:
          SITE: ${{ inputs.site }}
          SHA: ${{ needs.build.outputs.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/site
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Workers Editor on the site's Worker only (an environment secret of `inputs.site`).
          CLOUDFLARE_API_TOKEN: ${{ secrets.token }}
        run: scripts/sites/deploy.sh
