name: Docs rollback

# ADR-0029 decision 6 for the docs Worker (ADR-0028), with the shared static-site rollback
# (ADR-0033 decision 9): `wrangler rollback` to a given version, with a required reason. No build,
# seconds; it shares docs-deploy.yml's lock.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why (recorded as the deployment message)
        type: string
        required: true
      version_id:
        description: Target version id (from `pnpm --filter docs exec wrangler deployments list`)
        type: string
        required: true

concurrency:
  group: deploy-saas-foundation-docs
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  rollback:
    uses: ./.github/workflows/static-rollback.yml
    permissions:
      contents: read
    with:
      site: docs
      token_secret: CLOUDFLARE_DOCS_TOKEN
      reason: ${{ inputs.reason }}
      version_id: ${{ inputs.version_id }}
