name: Release

# ADR-0029: releases and production deploys of the `saas-foundation` Worker.
# - push to main: release-please updates the release PR. Merging the release PR creates the
#   release (tag web-vX.Y.Z) and this same run deploys it: build (no secrets) → production job:
#   preflight → restore point → migrate the tag's migrations → candidate at 0% + smoke test through
#   the override header → promote to 100%. The repository variable RELEASE_HOLD=true stops a
#   release at 0% (decision 3, `hold`), as does a change to routes/triggers (step 8).
# - workflow_dispatch: `promote` a held candidate, or `redeploy` an existing tag (same steps, under
#   decision 6's breaking-release guard), optionally with `hold`.
# The production job runs `main`'s scripts and migrator; the tag's build and migrations are data.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: promote = finish a held release; redeploy = build and deploy an existing tag
        type: choice
        options: [promote, redeploy]
        required: true
      tag:
        description: redeploy only, e.g. web-v0.2.0
        type: string
      hold:
        description: redeploy only, stop at 0% after the smoke test
        type: boolean
        default: false
      confirm_breaking:
        description: redeploy only, allow a tag that lacks an applied contract migration
        type: boolean
        default: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN: the release PR's CI then waits for the owner's "Approve workflows to run"
    # (decision 2); no PAT or App.
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please's labels
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  resolve:
    needs: release-please
    # Runs for dispatch too (release-please skipped).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      tag: ${{ steps.r.outputs.tag }}
      hold: ${{ steps.r.outputs.hold }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag }}
          ACTION: ${{ inputs.action }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_HOLD: ${{ inputs.hold }}
          VAR_HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          mode=; tag=; hold=false
          if [ "$EVENT" = push ]; then
            [ "$CREATED" = true ] || { echo "no release created"; exit 0; }
            mode=deploy; tag="$RP_TAG"; [ "$VAR_HOLD" = true ] && hold=true
          elif [ "$ACTION" = promote ]; then
            mode=promote
          else
            mode=redeploy; tag="$INPUT_TAG"; hold="$INPUT_HOLD"
          fi
          if [ "$mode" != promote ]; then
            [[ "$tag" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag '$tag'"; exit 1; }
          fi
          { echo "mode=$mode"; echo "tag=$tag"; echo "hold=$hold"; } >>"$GITHUB_OUTPUT"

  build:
    needs: resolve
    # Status functions: on dispatch, release-please (an ancestor) is skipped, and the implicit
    # success() would skip every job after it.
    if: ${{ !cancelled() && !failure() && (needs.resolve.outputs.mode == 'deploy' || needs.resolve.outputs.mode == 'redeploy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets, no cache: the tag's code is built, never run next to a credential.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # vite.config.ts stamps version, commit and build id <run id>-<attempt> (decision 4).
      - run: pnpm build && scripts/scan-client-bundle.sh
      - name: Assemble the artifact (Worker build + the tag's migrations)
        run: |
          out="$RUNNER_TEMP/release-artifact"
          mkdir -p "$out/apps/web" "$out/packages/db"
          rsync -a --exclude '.dev.vars*' --exclude '.env*' apps/web/dist "$out/apps/web/"
          rsync -a packages/db/drizzle "$out/packages/db/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: ${{ runner.temp }}/release-artifact
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  deploy:
    needs: [resolve, build]
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One lock per Worker, shared with rollback.yml and `promote`: nothing is cancelled, running or
    # queued, so a rollback can't interleave with a candidate being tested or promoted.
    concurrency:
      group: deploy-saas-foundation
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # tags, for the preceding release and the routes comparison
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: ${{ runner.temp }}/release-artifact
      - name: Preceding release and routes/triggers change
        id: prev
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          prev="$(git tag --list 'web-v*' --sort=-v:refname | awk -v t="$TAG" 'f {print; exit} $0 == t {f=1}')"
          echo "prev_tag=$prev" >>"$GITHUB_OUTPUT"
          echo "preceding release: ${prev:-none}"
          PREV_TAG="$prev" scripts/release/routes-changed.sh
      # Secrets are passed per step, never at job level and never to the install step.
      - name: Preflight (deployed secrets; no held candidate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release/preflight.sh
      - name: Restore point
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: scripts/release/restore-point.sh
      - name: Migrate (the tag's migrations, main's migrator)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          GUARD: ${{ needs.resolve.outputs.mode == 'redeploy' && '1' || '' }}
          CONFIRM_BREAKING: ${{ inputs.confirm_breaking }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: scripts/release/migrate.sh
      - name: Release candidate at 0% + smoke test
        id: candidate
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release/candidate.sh
      - name: Held at 0%
        if: needs.resolve.outputs.hold == 'true' || steps.prev.outputs.routes_changed == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate_version }}
          ROUTES: ${{ steps.prev.outputs.routes_changed }}
        run: |
          why="hold requested"; [ "$ROUTES" = true ] && why="routes/triggers changed: apply them by hand first"
          echo "::notice title=Held at 0%::$TAG ($CANDIDATE): $why. Test with the header Cloudflare-Workers-Version-Overrides: saas-foundation=\"$CANDIDATE\", then run this workflow with action: promote."
      - name: Promote to 100%
        if: needs.resolve.outputs.hold != 'true' && steps.prev.outputs.routes_changed != 'true'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate_version }}
          LIVE: ${{ steps.candidate.outputs.live_version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release/promote.sh

  promote:
    needs: resolve
    if: ${{ !cancelled() && !failure() && needs.resolve.outputs.mode == 'promote' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-saas-foundation
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Promote the held candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release/promote.sh
