name: Preview cleanup

# ADR-0011: delete the preview, its Hyperdrive config and its Neon branch when a PR closes,
# plus a daily janitor for anything a failed or racing run left behind (Hyperdrive and Neon
# Free have hard limits: 25 configs per account, 10 branches per project).
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number || 'janitor' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PREVIEW_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # no pnpm cache: this job's token is read-only, so saving the cache only produces warnings
      - run: pnpm install --frozen-lockfile
      - name: Delete this PR's preview resources
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/preview/down.sh
      - name: Janitor (orphans of closed PRs)
        if: github.event_name != 'pull_request'
        run: scripts/preview/janitor.sh
