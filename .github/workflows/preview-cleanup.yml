name: Preview cleanup

# ADR-0021: when a PR closes, delete its Worker Preview (cleanup-preview) and revoke its data by
# deleting its Hyperdrive config and Neon branch (cleanup-infra), split by privilege: no job holds
# both the Worker token and the Hyperdrive token. A daily janitor retries anything a run missed.
# `pull_request_target` runs this file from the default branch; no job checks out or runs PR code,
# and none restores or saves a cache (no package install at all: curl + jq + gh).
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# One lock for the whole cleanup run: `preview-pr-N` on close (shared with preview.yml, so cleanup
# waits for a running preview, E2E included), `preview-janitor` otherwise. The janitor can't take
# per-PR locks, so it skips PRs whose preview run is still active (next run retries).
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('preview-pr-{0}', github.event.pull_request.number) || 'preview-janitor' }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  cleanup-preview:
    # Fork PRs never get previews.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: read
      actions: read # janitor: is a preview run still active for this PR?
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete this PR's Worker Preview
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/preview/down.sh
      - name: Janitor (Previews of closed PRs)
        if: github.event_name != 'pull_request_target'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/preview/janitor.sh

  cleanup-infra:
    needs: cleanup-preview
    # Runs even if the Preview deletion failed: revoking the data is what matters.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview-infra
    permissions:
      contents: read
      pull-requests: read
      actions: read # janitor: is a preview run still active for this PR?
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_PREVIEW_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Revoke this PR's data (Hyperdrive config, then Neon branch)
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_INFRA_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
        run: scripts/preview/infra.sh down
      - name: Janitor (data of closed PRs)
        if: github.event_name != 'pull_request_target'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_INFRA_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
        run: scripts/preview/infra.sh janitor
