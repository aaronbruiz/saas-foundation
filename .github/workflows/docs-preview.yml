name: Docs preview

# ADR-0028 decision 5: a PR's docs site as Worker Preview `pr-N` of the docs preview Worker, and its
# deletion when the PR closes, with the shared static-site preview (ADR-0033 decision 9).
# `workflow_run` and `pull_request_target` run this file, and the workflow it calls, from the
# default branch; the token lives in environment `docs-preview` (main only) and is Workers Editor
# on the docs preview Worker only. No job runs PR code: the PR's built site (docs.yml's artifact)
# is deployed as data.
run-name: >-
  ${{ github.event_name == 'pull_request_target' && format('Docs preview cleanup PR #{0}', github.event.pull_request.number)
  || (github.event.workflow_run.pull_requests[0] && format('Docs preview PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'Docs preview (no PR)') }}
on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
  pull_request_target:
    types: [closed]
    # docs.yml's paths: only PRs that could have had a docs preview.
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .node-version
      - .github/workflows/docs*.yml
      - .github/workflows/static-*.yml
      - scripts/check-bindings.mjs
      - scripts/scan-client-bundle.sh
      - scripts/sites/**

# One lock per PR, shared by deploy and cleanup (as preview.yml). No PR in the event → a unique
# group, and `resolve` skips.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request_target' && format('docs-preview-pr-{0}', github.event.pull_request.number)
    || (github.event.workflow_run.pull_requests[0] && format('docs-preview-pr-{0}', github.event.workflow_run.pull_requests[0].number) || format('docs-preview-unlocked-{0}', github.run_id)) }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  preview:
    uses: ./.github/workflows/static-preview.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      site: docs
      label: Docs
    secrets:
      token: ${{ secrets.CLOUDFLARE_DOCS_PREVIEW_TOKEN }}
