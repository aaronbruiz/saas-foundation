name: Provenance

# Detects a push to main that isn't a squash merge of a PR whose CI was green on its final head
# (rules and checked range: scripts/check-provenance.mjs; why: start-new-product.md step 9). It
# blocks nothing: a failed run is the alert, emailed only if GitHub's Actions notification settings
# send failed runs to whoever triggered it. Own workflow, no concurrency group: a later push can't
# cancel an earlier check (ci.yml cancels on main). The daily run covers `[skip ci]` pushes; GitHub
# pauses schedules after 60 idle days on a public repo. Read-only token; no install, no secrets.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'

permissions: {}

jobs:
  provenance:
    name: Squash merge of a green PR
    # GITHUB_TOKEN only (no Cloudflare/Neon token): 1-vCPU runner.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # the checkout and the commit's parents
      pull-requests: read # the PR that merged the commit
      actions: read # CI runs on the PR's head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-provenance.mjs
          sparse-checkout-cone-mode: false
      - name: Check provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-provenance.mjs
