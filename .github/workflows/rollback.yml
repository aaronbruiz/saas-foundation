name: Rollback

# ADR-0029 decision 6: roll the production Worker back to an earlier version, code only (the
# database is never rolled back by a workflow; runbook "Database"). Defaults to the version that
# served 100% before the live one. The breaking-release guard compares the migrations production
# has applied with the target's journal and refuses past a contract migration unless
# confirm_breaking is set. Needs no build: it takes seconds.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why (recorded as the deployment message)
        type: string
        required: true
      version_id:
        description: Target Worker version id (empty = the previous version)
        type: string
      confirm_breaking:
        description: Allow a target that lacks an applied contract migration
        type: boolean
        default: false

permissions: {}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # The same lock as release.yml's deploy and promote jobs.
    concurrency:
      group: deploy-saas-foundation
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # the target commit's migration journal
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Secrets are passed per step, never at job level and never to the install step.
      - name: Resolve the target
        id: target
        env:
          VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release/rollback-target.sh
      - name: Breaking-release guard
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
          CONFIRM_BREAKING: ${{ inputs.confirm_breaking }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: scripts/release/rollback-guard.sh
      - name: Roll back
        env:
          TARGET: ${{ steps.target.outputs.target }}
          LIVE: ${{ steps.target.outputs.live }}
          TAG: ${{ steps.target.outputs.tag }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          source scripts/release/lib.sh
          # Stale check: the target was resolved against this live version.
          [ "$(deployment | jq -r '.versions | map(.version_id) | join(",")')" = "$LIVE" ] ||
            die "the deployment changed since the target was resolved; rerun"
          wrangler rollback "$TARGET" --name "$WORKER" -m "rollback by $ACTOR: $REASON" -y >&2
          for _ in $(seq 1 24); do
            [ "$(deployment | jq -r '.versions[0].version_id')" = "$TARGET" ] && break
            sleep 5
          done
          body="$(curl -sS -m 15 "https://$APP_HOST/api/health" || true)"
          echo "health after rollback: ${body:-no response}"
          echo "### Rolled back to $TARGET (${TAG:-untagged})" >>"$GITHUB_STEP_SUMMARY"
          jq -e '.ok == true' <<<"$body" >/dev/null || die "health isn't ok after the rollback"
