name: Static site build

# ADR-0028, ADR-0033 decision 9: builds a static site (apps/<site>) for a PR that can change its
# build; the callers (docs.yml, site.yml) own the triggers. static-deploy.yml's build runs the same
# scan and assertions on `main`. T0: no secrets, no environment. Scans the output
# like the app's client bundle (invariant 8) and asserts what the site promises
# (scripts/sites/assert-build.sh). For a same-repo PR it uploads the site as `<site>-site`, which
# the site's preview workflow deploys as data.
on:
  workflow_call:
    inputs:
      site:
        description: The site's app directory under apps/ (docs or site)
        type: string
        required: true

permissions: {}

jobs:
  build:
    name: ${{ inputs.site }} build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SITE: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$SITE" build
      - name: Scan the site for secrets
        run: scripts/scan-client-bundle.sh "apps/$SITE/dist"
      - name: Assert the site's files
        run: scripts/sites/assert-build.sh
      - name: Upload the site for the preview (same-repo PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.site }}-site
          path: apps/${{ inputs.site }}/dist
          retention-days: 3
          if-no-files-found: error
