name: Setup
description: >-
  pnpm (version from packageManager) and Node (.node-version), then `pnpm install --frozen-lockfile`.
  No dependency cache unless `cache: pnpm` (T0 jobs only: ADR-0021, ADR-0029 decision 3).
# A local action loads from the job's checkout. Jobs that check out a historical tag or commit
# (release.yml build, static-deploy.yml build) keep their setup inline: a tree older than this file
# has no action to load.
inputs:
  cache:
    description: "'pnpm' restores and saves setup-node's pnpm store cache; empty (default) uses none"
    required: false
    default: ''
  install:
    description: "'false' skips the install (the job runs its own after checks that must fail first)"
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        # setup-node auto-caches only npm today; off so a package-manager change can't turn it on.
        package-manager-cache: false
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
